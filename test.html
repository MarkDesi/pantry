<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firebase Test</title>
<style>
body{font-family:sans-serif;padding:20px;background:#f5f0e8;color:#2c2016}
.box{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;font-size:14px}
.ok{color:#5c7a5e;font-weight:500}
.err{color:#b85a5a;font-weight:500}
.pending{color:#a8957f}
pre{font-size:11px;background:#ede5d8;padding:10px;border-radius:8px;overflow-x:auto;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<h2 style="font-family:serif;margin-bottom:16px">Firebase Diagnostics</h2>

<div class="box" id="s1"><span class="pending">⏳ Loading Firebase SDK…</span></div>
<div class="box" id="s2"><span class="pending">⏳ Initialising app…</span></div>
<div class="box" id="s3"><span class="pending">⏳ Checking connection…</span></div>
<div class="box" id="s4"><span class="pending">⏳ Reading database…</span></div>
<div class="box" id="s5"><span class="pending">⏳ Writing to database…</span></div>
<div class="box" id="s6" style="display:none"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"
  onload="step1ok()" onerror="step1err()"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"
  onload="step1b()" onerror="step1berr()"></script>

<script>
var sdkLoaded=0;
function step1ok(){sdkLoaded++;if(sdkLoaded>=2)allSdkLoaded();}
function step1b(){sdkLoaded++;if(sdkLoaded>=2)allSdkLoaded();}
function step1err(){set("s1","❌ Firebase app SDK failed to load — possible network block","err");}
function step1berr(){set("s1","❌ Firebase database SDK failed to load — possible network block","err");}

function set(id,msg,cls){document.getElementById(id).innerHTML=`<span class="${cls||''}">${msg}</span>`;}

function allSdkLoaded(){
  set("s1","✅ Firebase SDKs loaded","ok");

  // Step 2: Init
  try{
    firebase.initializeApp({
      databaseURL:"https://pantry-61be7-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId:"pantry-61be7",
      appId:"pantry-app"
    });
    set("s2","✅ Firebase app initialised","ok");
  }catch(e){
    set("s2","❌ Init failed: "+e.message,"err");return;
  }

  var db=firebase.database();

  // Step 3: Connection status
  db.ref(".info/connected").on("value",function(snap){
    if(snap.val()===true){
      set("s3","✅ Connected to Firebase (real-time link established)","ok");
    } else {
      set("s3","⚠️ Firebase not connected yet — waiting…","pending");
    }
  });

  // Step 4: Read
  set("s4","<span class='pending'>⏳ Attempting to read shared/weekMeals…</span>");
  db.ref("shared/weekMeals").once("value").then(function(snap){
    var val=snap.val();
    set("s4","✅ Read succeeded — value: <pre>"+(val===null?"(empty — no data yet, that's fine)":JSON.stringify(val).substring(0,200))+"</pre>","ok");
    doWrite(db);
  }).catch(function(e){
    set("s4","❌ Read failed: "+e.message+"<br><br>This means your Firebase rules are blocking reads.","err");
    doWrite(db);
  });
}

function doWrite(db){
  // Step 5: Write
  set("s5","<span class='pending'>⏳ Attempting to write test value…</span>");
  db.ref("shared/__test__").set({t:Date.now(),msg:"diagnostics ok"}).then(function(){
    set("s5","✅ Write succeeded — Firebase is fully working","ok");
    set("s6","<span class='ok' style='font-size:15px;font-weight:500'>🎉 All checks passed — Firebase is working fine.<br><br>The issue is likely a stale cached version of the main app. <br><br>Steps to fix:<br>1. Delete the Pantry app from your home screen<br>2. In Safari go to Settings → Advanced → Website Data → delete your GitHub Pages entry<br>3. Revisit your GitHub Pages URL in Safari and re-add to home screen</span>");
    document.getElementById("s6").style.display="block";
    // Clean up test key
    db.ref("shared/__test__").remove();
  }).catch(function(e){
    set("s5","❌ Write failed: "+e.message+"<br><br>Rules are blocking writes. Go to Firebase Console → Realtime Database → Rules and set both .read and .write to true, then Publish.","err");
    document.getElementById("s6").style.display="block";
    set("s6","<span class='err'>Fix the rules above, then reload this page to retest.</span>","err");
  });
}

// Timeout if SDK never loads
setTimeout(function(){
  if(sdkLoaded<2) set("s1","❌ Firebase SDK timed out loading — check your internet connection","err");
},8000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pantry">
<meta name="theme-color" content="#F5F0E8">
<title>Pantry — Mark & Maddi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body{font-family:'DM Sans',sans-serif;background:#F5F0E8;color:#2C2016}
:root{
  --cream:#F5F0E8;--warm1:#EDE5D8;--warm2:#DDD0BC;--warm3:#C4B49A;
  --brown:#6B5744;--dark:#2C2016;--text1:#2C2016;--text2:#7A6652;--text3:#A8957F;
  --green:#5C7A5E;--red:#B85A5A;--blue:#4A6B8A;
  --st:env(safe-area-inset-top,44px);--sb:env(safe-area-inset-bottom,0px);
}
#app{max-width:430px;margin:0 auto;height:100vh;display:flex;flex-direction:column;background:var(--cream);overflow:hidden}
.hdr{padding:calc(var(--st) + 6px) 24px 0;flex-shrink:0}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:1.6px;text-transform:uppercase;color:var(--text3);margin-bottom:4px;display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warm3);transition:background .3s}
.dot.live{background:var(--green)}.dot.sync{background:#BA7517}
.ttl{font-family:'Fraunces',serif;font-size:32px;font-weight:400;color:var(--dark);line-height:1.05;letter-spacing:-.5px;padding-bottom:14px;min-height:64px;display:flex;align-items:flex-end}
.ttl em{font-style:italic;color:var(--brown)}
.tabs{display:flex;background:var(--warm1);margin:0 20px;border-radius:13px;padding:4px;gap:2px;flex-shrink:0}
.tb{flex:1;padding:8px 4px 7px;border:none;background:transparent;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:11px;color:var(--text3);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .15s}
.tb.on{background:var(--cream);color:var(--dark);font-weight:500;box-shadow:0 1px 6px rgba(44,32,22,.1)}
.tb-ic{font-size:16px;line-height:1}
.scr{flex:1;overflow-y:auto;padding:14px 20px calc(var(--sb) + 80px);-webkit-overflow-scrolling:touch}
.scr::-webkit-scrollbar{display:none}
.card{background:#fff;border-radius:16px;padding:4px 14px;margin-bottom:10px;box-shadow:0 1px 8px rgba(44,32,22,.07)}
.slbl{font-size:10px;font-weight:500;letter-spacing:1.3px;text-transform:uppercase;color:var(--text3);margin:18px 0 8px 2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.sp{background:#fff;border-radius:12px;padding:12px 6px;text-align:center;box-shadow:0 1px 6px rgba(44,32,22,.06)}
.sp-n{font-family:'Fraunces',serif;font-size:24px;color:var(--dark);line-height:1}
.sp-l{font-size:9px;color:var(--text3);margin-top:3px}
.mlist{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 8px rgba(44,32,22,.07)}
.mrow{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--warm1);user-select:none;-webkit-user-select:none}
.mrow:last-child{border-bottom:none}.mrow.drag-over{background:var(--warm1)}
.dh{color:var(--warm3);font-size:13px;cursor:grab;flex-shrink:0;padding:3px 2px;touch-action:none}
.dh.lk{cursor:default;opacity:.3}
.mday{font-size:11px;font-weight:500;color:var(--text3);width:28px;flex-shrink:0}
.mnm{flex:1;font-size:13.5px;color:var(--text1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stag{font-size:10px;font-weight:500;padding:2px 7px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.xbtn{background:none;border:none;color:var(--warm3);font-size:14px;cursor:pointer;padding:3px;flex-shrink:0;line-height:1}
.addrow{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--warm1);cursor:pointer}
.addrow:last-child{border-bottom:none}
.addc{width:22px;height:22px;border-radius:50%;background:var(--warm1);color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.wact{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:14px;border:none;border-radius:14px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:opacity .15s,transform .15s}
.btn:active{opacity:.85;transform:scale(.98)}.btn.primary{background:var(--dark);color:var(--cream)}
.btn.sec{background:var(--warm1);color:var(--text2);flex:0 0 auto;padding:14px 16px}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.spin{display:inline-block;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}.spin.go{transform:rotate(360deg)}
.lkbanner{background:var(--warm1);border-radius:11px;padding:9px 13px;margin-bottom:10px;display:flex;align-items:center;gap:9px;font-size:12px;color:var(--text2)}
.rest{display:flex;align-items:center;gap:9px;padding:11px 14px;border-top:1px solid var(--warm1)}
.rest span{font-size:13.5px;color:var(--text3);font-style:italic}
.lwcard{background:#fff;border-radius:14px;padding:13px 14px;box-shadow:0 1px 6px rgba(44,32,22,.06);margin-bottom:10px}
.lwrow{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid var(--warm1)}
.lwrow:last-child{border-bottom:none}
.lwday{font-size:10px;color:var(--text3);width:28px;flex-shrink:0}
.lwnm{font-size:12px;color:var(--text2);flex:1}
.prog{height:3px;background:var(--warm2);border-radius:2px;overflow:hidden;margin-bottom:12px}
.progf{height:100%;background:var(--green);border-radius:2px;transition:width .35s}
.pmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.ptxt{font-size:12px;color:var(--text3)}
.rbtn{font-size:12px;color:var(--text3);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif}
.aislecard{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:9px;box-shadow:0 1px 6px rgba(44,32,22,.06)}
.aislehd{display:flex;align-items:center;gap:8px;padding:9px 14px 7px}
.adot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.anm{font-size:12px;font-weight:500;color:var(--text2);flex:1}
.act{font-size:11px;color:var(--text3)}
.srow{display:flex;align-items:flex-start;gap:11px;padding:9px 14px;border-bottom:1px solid var(--warm1);cursor:pointer}
.srow:last-child{border-bottom:none}
.chk{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--warm3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:all .2s;margin-top:1px}
.chk.done{background:var(--green);border-color:var(--green);color:#fff}
.sinfo{flex:1;min-width:0}
.snm{font-size:13px;color:var(--text1);line-height:1.3}
.snm.done{color:var(--text3);text-decoration:line-through}
.sqty{font-size:11px;color:var(--text3);margin-top:1px;font-weight:500}
.sbadges{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.sbadge{font-size:10px;padding:2px 7px;border-radius:20px;white-space:nowrap}
.fmtag{font-size:10px;background:#E3EDE3;color:var(--green);padding:2px 6px;border-radius:10px;margin-left:4px}
.srchwrap{position:relative;margin-bottom:12px}
.srch{width:100%;padding:11px 14px 11px 36px;background:#fff;border:1.5px solid var(--warm2);border-radius:12px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text1);outline:none;-webkit-appearance:none}
.srch:focus{border-color:var(--brown)}.srch::placeholder{color:var(--warm3)}
.srch-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}
.srch-x{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:var(--warm2);border:none;border-radius:50%;width:19px;height:19px;cursor:pointer;font-size:11px;color:var(--text2);display:flex;align-items:center;justify-content:center}
.rc{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 17px;background:#fff;border-radius:14px;margin-bottom:7px;box-shadow:0 1px 6px rgba(44,32,22,.06);position:relative;overflow:hidden}
.rbar{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:14px 0 0 14px}
.ri{flex:1;min-width:0}
.rnm{font-size:14px;font-weight:500;color:var(--text1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmeta{font-size:11px;color:var(--text3);margin-top:2px;display:flex;align-items:center;gap:6px}
.rlink{font-size:10px;color:var(--blue);text-decoration:none}
.rc.off{opacity:.38}
.tog{width:28px;height:28px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0}
.tog.on{background:var(--green);color:#fff}.tog.pause{background:var(--warm1);color:var(--text3)}
.tog.sp{background:#F0E8DC;color:var(--brown);cursor:default}
.ebtn{width:26px;height:26px;border-radius:50%;border:none;background:var(--warm1);color:var(--text3);font-size:12px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.dbtn{width:24px;height:24px;border-radius:50%;border:none;background:var(--warm1);color:var(--text3);font-size:12px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sugcard{background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:9px;box-shadow:0 1px 6px rgba(44,32,22,.06)}
.sugnm{font-size:14px;font-weight:500;color:var(--text1);margin-bottom:3px}
.sugdesc{font-size:12px;color:var(--text3);line-height:1.45;margin-bottom:9px}
.sugact{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.sbtn{padding:6px 13px;border-radius:20px;border:none;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.sbtn.add{background:var(--dark);color:var(--cream)}.sbtn.view{background:var(--warm1);color:var(--text2)}.sbtn.dis{background:transparent;color:var(--text3)}
.ptrow{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.ptin{flex:1;padding:9px 11px;background:#fff;border:1.5px solid var(--warm2);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text1);outline:none;-webkit-appearance:none}
.ptin:focus{border-color:var(--brown)}
.ptqty{width:80px;padding:9px 10px;background:#fff;border:1.5px solid var(--warm2);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text1);outline:none;-webkit-appearance:none;flex-shrink:0}
.ptqty:focus{border-color:var(--brown)}
.ptx{width:26px;height:26px;border-radius:50%;border:none;background:var(--warm1);color:var(--text3);font-size:13px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ptadd{padding:7px 13px;border-radius:20px;border:1.5px dashed var(--warm2);background:transparent;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text3);cursor:pointer;margin-top:6px}
.fab{position:fixed;bottom:calc(var(--sb) + 22px);right:calc(50% - 195px);width:52px;height:52px;background:var(--dark);color:var(--cream);border:none;border-radius:50%;font-size:26px;cursor:pointer;box-shadow:0 4px 18px rgba(44,32,22,.25);display:flex;align-items:center;justify-content:center;z-index:40;transition:transform .15s}
.fab:active{transform:scale(.9)}@media(max-width:430px){.fab{right:18px}}
.bd{position:fixed;inset:0;background:rgba(44,32,22,.45);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:430px;background:var(--cream);border-radius:24px 24px 0 0;padding:0 20px calc(var(--sb) + 24px);max-height:92vh;overflow-y:auto;animation:sup .3s cubic-bezier(.32,.72,0,1)}
.sh::-webkit-scrollbar{display:none}
@keyframes sup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.hndl{width:36px;height:4px;background:var(--warm3);border-radius:2px;margin:11px auto 18px}
.shtl{font-family:'Fraunces',serif;font-size:22px;color:var(--dark);margin-bottom:4px}
.shtl em{font-style:italic;color:var(--brown)}
.shsub{font-size:12px;color:var(--text3);margin-bottom:18px;line-height:1.5}
.flbl{font-size:10px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.fin{width:100%;padding:12px 13px;background:#fff;border:1.5px solid var(--warm2);border-radius:12px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text1);outline:none;margin-bottom:14px;-webkit-appearance:none}
.fin:focus{border-color:var(--brown)}.fin::placeholder{color:var(--warm3)}
.srcpick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.schip{padding:6px 13px;border-radius:20px;border:1.5px solid var(--warm2);background:#fff;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer}
.schip.on{border-color:transparent;color:#fff}
.cbtn{width:100%;padding:14px;background:var(--dark);color:var(--cream);border:none;border-radius:13px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;margin-top:4px}
.cbtn:disabled{opacity:.35;cursor:default}
.scrapest{font-size:12px;padding:9px 13px;border-radius:10px;margin-bottom:13px;display:none}
.scrapest.loading{background:var(--warm1);color:var(--text2);display:block}
.scrapest.ok{background:#E3EDE3;color:var(--green);display:block}
.scrapest.err{background:#fdeaea;color:var(--red);display:block}
.picklist{border-radius:12px;background:#fff;box-shadow:0 1px 6px rgba(44,32,22,.07);max-height:320px;overflow-y:auto}
.picklist::-webkit-scrollbar{display:none}
.pickrow{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--warm1);cursor:pointer}
.pickrow:last-child{border-bottom:none}
.pickinfo{flex:1}.picknm{font-size:14px;font-weight:500;color:var(--text1)}.picktag{font-size:11px;margin-top:2px}
.pickadd{background:var(--dark);color:var(--cream);border:none;border-radius:20px;padding:5px 13px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;flex-shrink:0}
.inged{margin-top:4px}
.inged-ttl{font-size:10px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-bottom:7px;margin-top:14px;display:flex;align-items:center;justify-content:space-between}
.ingrow{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.ingn{flex:1;padding:8px 11px;background:#fff;border:1.5px solid var(--warm2);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text1);outline:none;-webkit-appearance:none}
.ingn:focus{border-color:var(--brown)}
.ingq{width:78px;padding:8px 9px;background:#fff;border:1.5px solid var(--warm2);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text1);outline:none;-webkit-appearance:none;flex-shrink:0}
.ingq:focus{border-color:var(--brown)}
.ingx{width:25px;height:25px;border-radius:50%;border:none;background:var(--warm1);color:var(--text3);font-size:12px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ingadd{padding:6px 12px;border-radius:20px;border:1.5px dashed var(--warm2);background:transparent;font-family:'DM Sans',sans-serif;font-size:11px;color:var(--text3);cursor:pointer;margin-top:3px}
.hint{font-size:12px;color:var(--text3);margin-bottom:12px;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="eyebrow"><span class="dot" id="sdot"></span><span id="slbl">Connecting…</span></div>
    <div class="ttl" id="ttl"><em>This</em>&nbsp;week</div>
  </div>
  <div class="tabs">
    <button class="tb on" data-tab="plan" onclick="go('plan')"><span class="tb-ic">📅</span>Plan</button>
    <button class="tb" data-tab="list" onclick="go('list')"><span class="tb-ic">🛒</span>List</button>
    <button class="tb" data-tab="recipes" onclick="go('recipes')"><span class="tb-ic">📖</span>Recipes</button>
    <button class="tb" data-tab="pantry" onclick="go('pantry')"><span class="tb-ic">🏠</span>Pantry</button>
  </div>
  <div class="scr" id="scr"></div>
</div>

<!-- Add/Edit Recipe -->
<div class="bd" id="m-add" style="display:none" onclick="if(event.target===this)closeM('m-add')">
  <div class="sh">
    <div class="hndl"></div>
    <div class="shtl" id="add-ttl">Add a <em>recipe</em></div>
    <div class="shsub">Paste a URL to auto-fill from RecipeTin, OnTrac5 or KIC.</div>
    <div class="flbl">Recipe URL (paste to auto-fill)</div>
    <input class="fin" id="f-url" type="url" placeholder="https://..." oninput="onUrl(this.value)">
    <div class="scrapest" id="scrapest"></div>
    <div class="flbl">Recipe name *</div>
    <input class="fin" id="f-name" placeholder="e.g. Thai Basil Chicken" oninput="valForm()">
    <div class="flbl">Tags</div>
    <input class="fin" id="f-tag" placeholder="e.g. Chicken · Asian">
    <div class="flbl">Source</div>
    <div class="srcpick" id="srcpick"></div>
    <div class="inged" id="inged"></div>
    <button class="cbtn" id="cbtn" onclick="saveRecipe()" disabled>Save recipe</button>
  </div>
</div>

<!-- Pick Meal -->
<div class="bd" id="m-pick" style="display:none" onclick="if(event.target===this)closeM('m-pick')">
  <div class="sh">
    <div class="hndl"></div>
    <div class="shtl" id="pick-ttl">Choose a <em>meal</em></div>
    <div style="position:relative;margin-bottom:12px">
      <span style="position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none">🔍</span>
      <input class="fin" style="padding-left:34px;margin-bottom:0" id="psrch" placeholder="Search recipes…" oninput="rpick()">
    </div>
    <div class="picklist" id="plist"></div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────
// SUPABASE CONFIG
// ─────────────────────────────────────────────────────────────────
const SB_URL = "https://uznunapsrydzpvqbdttn.supabase.co";
const SB_KEY = "sb_publishable_xZiYu6kmu3SPyo-VQDOEYg_hTKELd_k";
const SB_HEADERS = {
  "Content-Type": "application/json",
  "apikey": SB_KEY,
  "Authorization": "Bearer " + SB_KEY,
};

// Read a key from Supabase
async function dbGet(key) {
  try {
    const r = await fetch(SB_URL + "/rest/v1/pantry?key=eq." + key + "&select=value", {
      headers: SB_HEADERS
    });
    const rows = await r.json();
    if (rows && rows.length > 0) return rows[0].value;
    return null;
  } catch(e) { console.warn("dbGet", key, e); return null; }
}

// Write a key to Supabase (upsert)
async function dbSet(key, value) {
  try {
    await fetch(SB_URL + "/rest/v1/pantry", {
      method: "POST",
      headers: { ...SB_HEADERS, "Prefer": "resolution=merge-duplicates" },
      body: JSON.stringify({ key, value })
    });
    syncUI("live");
  } catch(e) { console.warn("dbSet", key, e); syncUI("off"); }
}

// Poll for changes every 3 seconds (live sync between phones)
var pollValues = {};
async function poll() {
  try {
    const r = await fetch(SB_URL + "/rest/v1/pantry?select=key,value", { headers: SB_HEADERS });
    const rows = await r.json();
    if (!Array.isArray(rows)) return;
    let changed = false;
    rows.forEach(row => {
      const prev = JSON.stringify(pollValues[row.key]);
      const curr = JSON.stringify(row.value);
      if (prev !== curr) {
        pollValues[row.key] = row.value;
        applyKey(row.key, row.value);
        changed = true;
      }
    });
    syncUI("live");
    if (changed) go(S.tab);
  } catch(e) { syncUI("off"); }
}

function applyKey(key, value) {
  const arr = v => !v ? [] : (Array.isArray(v) ? v : Object.values(v));
  if (key === "meals")     S.meals     = arr(value);
  if (key === "recipes")   S.recipes   = arr(value).length ? arr(value) : DREC;
  if (key === "checked")   S.checked   = value || {};
  if (key === "locked")    S.locked    = !!value;
  if (key === "lastWeek")  S.lastWeek  = arr(value);
  if (key === "dismissed") S.dismissed = arr(value);
  if (key === "staples")   S.staples   = arr(value).length ? arr(value) : DSTAPLES;
}

// Write + update local state immediately so UI never waits
function save(key, value) {
  applyKey(key, value);
  go(S.tab);
  syncUI("sync");
  dbSet(key, value);
}

function syncUI(s) {
  const d = document.getElementById("sdot");
  const l = document.getElementById("slbl");
  if (!d) return;
  d.className = "dot" + (s==="live" ? " live" : s==="sync" ? " sync" : "");
  if (l) l.textContent = s==="live" ? "Live · Mark & Maddi" : s==="sync" ? "Saving…" : "Reconnecting…";
}

// Load all data on start, then poll every 3s
async function initDB() {
  try {
    const r = await fetch(SB_URL + "/rest/v1/pantry?select=key,value", { headers: SB_HEADERS });
    const rows = await r.json();
    if (Array.isArray(rows)) {
      rows.forEach(row => { pollValues[row.key] = row.value; applyKey(row.key, row.value); });
      syncUI("live");
    }
  } catch(e) { syncUI("off"); }
  go(S.tab);
  setInterval(poll, 3000);
}

// ─────────────────────────────────────────────────────────────────
function mergeQty(a,b){
  const g=q=>{const m=q.match(/(\d+\.?\d*)\s*(g|kg)/i);if(!m)return null;return m[2].toLowerCase()==="kg"?parseFloat(m[1])*1000:parseFloat(m[1]);};
  const g1=g(a),g2=g(b);
  if(g1&&g2){const t=g1+g2;return t>=1000?(t/1000).toFixed(1).replace(/\.0$/,"")+"kg":t+"g";}
  const c=q=>{const m=q.match(/(\d+\.?\d*)\s*cup/i);return m?parseFloat(m[1]):null;};
  const c1=c(a),c2=c(b);if(c1&&c2)return(c1+c2)+" cups";
  const n=q=>{const m=q.match(/^(\d+)$/);return m?parseInt(m[1]):null;};
  const n1=n(a),n2=n(b);if(n1&&n2)return""+(n1+n2);
  return a+" + "+b;
}
function guessAisle(n){
  const l=n.toLowerCase();
  if(/(banana|avocado|cucumber|capsicum|carrot|zucchini|lettuce|spinach|salad|parsley|coriander|basil|mint|chive|spring onion|lemon|lime|mango|berry|feta|sourdough|onion)/.test(l))return"fm";
  if(/(garlic|potato|sweet potato|mushroom|ginger|chilli|celery|tomato|broccolini|broccoli)/.test(l))return"produce";
  if(/(yoghurt|yogurt|goat cheese|meredith|chobani|ham|salami)/.test(l))return"deli";
  if(/(chicken|beef|mince|steak|lamb|pork|sausage|bacon|prawn|shrimp|salmon|tuna|fish|gyoza|dumpling)/.test(l))return"meat";
  if(/(bread|bun|roll|pita|wrap|tortilla|pizza base|crumpet)/.test(l))return"bakery";
  if(/(milk|cream|butter|cheese|parmesan|mozzarella|ricotta|egg|halloumi|sour cream)/.test(l))return"dairy";
  if(/(pasta|spaghetti|fettuccine|penne|rigatoni|lasagne|rice|noodle|udon|ramen|risoni|orzo)/.test(l))return"pasta";
  if(/(frozen|raspberry|hashbrown|edamame)/.test(l))return"frozen";
  if(/(weetbix|weet-bix|cereal|granola|oat|porridge|peanut butter)/.test(l))return"breakfast";
  return"pantry";
}
function buildList(){
  const map={};AK.forEach(k=>{map[k]=[];});
  S.staples.forEach(sec=>{sec.items.forEach(item=>{const k=guessAisle(item.n);if(map[k])map[k].push({n:item.n,q:item.q||"",staple:true,recipes:[]});});});
  S.meals.forEach(meal=>{
    const rec=S.recipes.find(r=>r.id===meal.id);if(!rec||!rec.ingredients)return;
    const col=(SRC[rec.src]||SRC.other).color;
    AK.forEach(ak=>{
      (rec.ingredients[ak]||[]).forEach(ing=>{
        const nm=typeof ing==="string"?ing:(ing.n||"");const qty=typeof ing==="string"?"":(ing.q||"");if(!nm)return;
        const nk=nm.toLowerCase().replace(/\(.*?\)/g,"").trim().split(/[\s,]+/).slice(0,3).join(" ");
        const ex=map[ak].find(i=>{const ek=i.n.toLowerCase().replace(/\(.*?\)/g,"").trim().split(/[\s,]+/).slice(0,3).join(" ");return ek===nk||ek.includes(nk)||nk.includes(ek);});
        if(ex){if(!ex.recipes)ex.recipes=[];if(!ex.recipes.find(r=>r.id===meal.id))ex.recipes.push({id:meal.id,name:meal.name,color:col});if(qty&&ex.q&&ex.q!==qty&&!ex.q.includes(qty))ex.q=mergeQty(ex.q,qty);else if(qty&&!ex.q)ex.q=qty;}
        else map[ak].push({n:nm,q:qty,staple:false,recipes:[{id:meal.id,name:meal.name,color:col}]});
      });
    });
  });
  return AISLES.map(a=>({...a,items:map[a.key]})).filter(a=>a.items.length>0);
}

const PROXIES=[u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,u=>`https://api.allorigins.win/get?url=${encodeURIComponent(u)}`];
async function fetchProxy(url){for(const mk of PROXIES){try{const r=await fetch(mk(url),{signal:AbortSignal.timeout(7000)});if(!r.ok)continue;const t=await r.text();try{const j=JSON.parse(t);if(j.contents)return j.contents;}catch{}return t;}catch{}}return null;}
function splitIngredient(raw) {
  // Clean up messy scraped strings first
  let str = raw
    .replace(/\(\(.*?\)\)/g, '')     // remove ((substitutes))
    .replace(/\(,\s*/g, '(')          // fix "(, diced)" -> "(diced)"
    .replace(/\s{2,}/g, ' ')
    .trim();

  let qty = '';
  let name = str;

  // Step 1: pull off any leading quantity expression
  // Matches: "500g", "1/2 cup", "2 1/4 cups", "1 tsp", "3", "1/2", etc.
  const qtyRe = /^((?:[\d]+\s+)?[\d¼½¾⅓⅔⅛⅜⅝⅞]*[\/\d\.]*\s*(?:g|kg|ml|l|lb|oz|cups?|tbsps?|tsps?|teaspoons?|tablespoons?|bunchs?|bunches|cloves?|pieces?|cans?|tins?|bottles?|sprigs?|handfuls?|pinch|dash|small|medium|large)s?\s+|(?:[\d]+\s+[\d\/\.]+|[\d¼½¾⅓⅔⅛⅜⅝⅞\/\.]+)\s+|[\d]+\s+)/i;

  const m = str.match(qtyRe);
  if (m) {
    qty = m[1].trim();
    name = str.slice(m[1].length).trim();
  }

  // Step 2: clean the ingredient name — remove prep notes
  name = name
    .replace(/\s*\([^)]*\)\s*/g, ' ')  // remove (boneless, skinless) etc
    .replace(/,.*$/, '')                 // remove ", finely minced" etc
    .replace(/\s{2,}/g, ' ')
    .trim();

  // Capitalise
  if (name) name = name.charAt(0).toUpperCase() + name.slice(1);

  return { n: name || str.trim(), q: qty };
}

function catIngs(list) {
  const m = {}; AK.forEach(k => { m[k] = []; });
  const rules = [
    {k:"meat",     w:["chicken","beef","mince","steak","lamb","pork","sausage","bacon","prawn","shrimp","salmon","tuna","fish","gyoza","dumpling","seafood"]},
    {k:"dairy",    w:["milk","cream","butter","cheese","parmesan","mozzarella","ricotta","yoghurt","yogurt","egg","feta","halloumi","sour cream"]},
    {k:"pasta",    w:["pasta","spaghetti","fettuccine","penne","rigatoni","lasagne","rice","noodle","udon","ramen","risoni","orzo"]},
    {k:"frozen",   w:["frozen","edamame","hashbrown"]},
    {k:"bakery",   w:["bread","sourdough","bun","roll","pita","wrap","tortilla","pizza base","crumpet"]},
    {k:"fm",       w:["cucumber","capsicum","capsicums","carrot","avocado","banana","zucchini","lettuce","spinach","salad","parsley","coriander","basil","mint","lemon","lime","mango","berry","tomato","onion","spring onion","green onion"]},
    {k:"produce",  w:["garlic","potato","sweet potato","mushroom","ginger","chilli","chili","celery","broccolini","broccoli","pepper flakes"]},
    {k:"breakfast",w:["oat","cereal","granola","weetbix","peanut butter"]},
  ];
  list.forEach(raw => {
    if (!raw || !raw.trim()) return;
    const parsed = splitIngredient(raw);
    const l = parsed.n.toLowerCase();
    let placed = false;
    for (const rule of rules) {
      if (rule.w.some(w => l.includes(w))) {
        m[rule.k].push(parsed);
        placed = true; break;
      }
    }
    if (!placed) m.pantry.push(parsed);
  });
  AK.forEach(k => { if (!m[k].length) delete m[k]; });
  return m;
}
function onUrl(val){clearTimeout(S.scrapeTimer);S.scrapedIngs={};if(!val||!val.startsWith("http")){document.getElementById("scrapest").className="scrapest";return;}if(val.includes("recipetineats.com"))selSrc("rte");else if(val.includes("ontrac5.com"))selSrc("ontrac");else if(val.includes("kic"))selSrc("kic");S.scrapeTimer=setTimeout(()=>doScrape(val),800);}
async function doScrape(url){
  const st=document.getElementById("scrapest");st.className="scrapest loading";st.textContent="Fetching recipe…";
  const html=await fetchProxy(url);if(!html){st.className="scrapest err";st.textContent="Couldn't reach that URL — type the name manually.";return;}
  let title="",ings=[];
  for(const m of html.matchAll(/<script[^>]+type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi)){try{const j=JSON.parse(m[1]);const schemas=Array.isArray(j)?j:[j];for(const sc of schemas){const item=sc["@type"]==="Recipe"?sc:(sc["@graph"]||[]).find(g=>g["@type"]==="Recipe");if(item){title=item.name||"";ings=item.recipeIngredient||[];break;}}if(title)break;}catch{}}
  if(!title){const og=html.match(/<meta[^>]+property=["']og:title["'][^>]+content=["']([^"']+)["']/i)||html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:title["']/i);if(og)title=og[1];else{const t=html.match(/<title[^>]*>([^<]{3,100})<\/title>/i);if(t)title=t[1];}}
  title=title.replace(/\s*[|\-–—].*$/,"").replace(/&amp;/g,"&").replace(/&#0*39;/g,"'").trim();
  if(!title){st.className="scrapest err";st.textContent="Couldn't read that page — type the name manually.";return;}
  document.getElementById("f-name").value=title;valForm();
  if(ings.length){S.scrapedIngs=catIngs(ings);S.editIngs=JSON.parse(JSON.stringify(S.scrapedIngs));document.getElementById("inged").innerHTML=rIngEditor(S.editIngs);const tot=Object.values(S.scrapedIngs).reduce((a,v)=>a+v.length,0);st.className="scrapest ok";st.textContent=`✓ "${title.substring(0,36)}" — ${tot} ingredients found`;}
  else{st.className="scrapest ok";st.textContent=`✓ "${title.substring(0,46)}" — add ingredients below`;}
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'DM Sans',sans-serif;background:#F5F0E8;color:#2C2016;-webkit-font-smoothing:antialiased}
:root{
  --cream:#F5F0E8;--warm1:#EDE5D8;--warm2:#DDD0BC;--warm3:#C4B49A;
  --brown:#6B5744;--dark:#2C2016;--text1:#2C2016;--text2:#7A6652;--text3:#A8957F;
  --green:#5C7A5E;--red:#B85A5A;--blue:#4A6B8A;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
#app{max-width:430px;margin:0 auto;height:100vh;display:flex;flex-direction:column;overflow:hidden;background:var(--cream)}
.app-header{padding:calc(var(--safe-top) + 48px) 24px 0;flex-shrink:0}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:1.8px;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.page-title{font-family:'Fraunces',serif;font-size:34px;font-weight:400;color:var(--dark);line-height:1.05;letter-spacing:-0.5px;min-height:72px;display:flex;align-items:flex-end;padding-bottom:16px}
.page-title em{font-style:italic;color:var(--brown)}
.tab-bar{display:flex;background:var(--warm1);margin:0 20px;border-radius:14px;padding:4px;gap:2px;flex-shrink:0}
.tab-btn{flex:1;padding:9px 4px 8px;border:none;background:transparent;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:400;color:var(--text3);cursor:pointer;transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab-icon{font-size:17px;line-height:1}
.tab-btn.active{background:var(--cream);color:var(--dark);font-weight:500;box-shadow:0 1px 8px rgba(44,32,22,.1)}
.scroll-area{flex:1;overflow-y:auto;padding:16px 20px calc(var(--safe-bottom) + 84px);-webkit-overflow-scrolling:touch}
.scroll-area::-webkit-scrollbar{display:none}
.card{background:#fff;border-radius:18px;padding:4px 16px;margin-bottom:12px;box-shadow:0 1px 10px rgba(44,32,22,.07)}
.section-label{font-size:10.5px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;color:var(--text3);margin:22px 0 9px 2px}

/* STATS */
.week-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.stat-pill{background:#fff;border-radius:14px;padding:13px 8px 11px;text-align:center;box-shadow:0 1px 8px rgba(44,32,22,.06)}
.stat-num{font-family:'Fraunces',serif;font-size:26px;font-weight:400;color:var(--dark);line-height:1}
.stat-lbl{font-size:10px;color:var(--text3);margin-top:3px}

/* MEAL ROWS */
.meals-container{background:#fff;border-radius:18px;box-shadow:0 1px 10px rgba(44,32,22,.07);overflow:hidden;margin-bottom:12px}
.meal-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--warm1);position:relative;user-select:none;-webkit-user-select:none}
.meal-row:last-child{border-bottom:none}
.meal-row.dragging{opacity:.35}
.meal-row.drag-over{background:var(--warm1)}
.drag-handle{color:var(--warm3);font-size:14px;cursor:grab;flex-shrink:0;padding:4px 2px;line-height:1;touch-action:none}
.meal-day{font-size:11px;font-weight:500;color:var(--text3);width:30px;flex-shrink:0}
.meal-name-wrap{flex:1;min-width:0}
.meal-name{font-size:14px;color:var(--text1);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-pill{font-size:10px;font-weight:500;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.meal-remove{background:none;border:none;color:var(--warm3);font-size:15px;cursor:pointer;padding:4px;flex-shrink:0;line-height:1;transition:color .15s}
.meal-remove:active{color:var(--red)}
.add-meal-row{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--warm1);transition:background .15s}
.add-meal-row:last-child{border-bottom:none}
.add-meal-row:active{background:var(--warm1)}
.add-meal-icon{width:24px;height:24px;border-radius:50%;background:var(--warm1);color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.add-meal-text{font-size:13px;color:var(--text3)}
.meal-rest{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--warm1)}
.meal-rest .meal-day{color:var(--text3)}
.meal-rest span{font-size:14px;color:var(--text3);font-style:italic}
.shuffle-btn{width:100%;padding:15px;background:var(--dark);color:var(--cream);border:none;border-radius:16px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:9px;transition:opacity .15s,transform .15s}
.shuffle-btn:active{opacity:.85;transform:scale(.98)}
.shuffle-icon{display:inline-block;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.shuffle-icon.spin{transform:rotate(360deg)}

/* SHOPPING LIST */
.list-legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3)}
.legend-dot{width:8px;height:8px;border-radius:50%}
.progress-wrap{margin-bottom:14px}
.progress-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.progress-text{font-size:12px;color:var(--text3)}
.reset-btn{font-size:12px;color:var(--text3);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;padding:2px 6px;border-radius:6px}
.progress-track{height:3px;background:var(--warm2);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);border-radius:2px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.aisle-block{margin-bottom:10px}
.aisle-header-row{display:flex;align-items:center;gap:9px;padding:10px 14px 8px}
.aisle-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.aisle-name-txt{font-size:12px;font-weight:500;color:var(--text2);flex:1}
.aisle-count{font-size:11px;color:var(--text3)}
.shop-item{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--warm1);transition:background .1s}
.shop-item:last-child{border-bottom:none}
.shop-item:active{background:var(--warm1)}
.check-ring{width:23px;height:23px;border-radius:50%;border:1.5px solid var(--warm3);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s cubic-bezier(.34,1.56,.64,1);font-size:12px;color:transparent}
.check-ring.done{background:var(--green);border-color:var(--green);color:#fff;transform:scale(1.1)}
.item-info{flex:1;min-width:0}
.item-nm{font-size:13.5px;color:var(--text1);transition:color .2s;line-height:1.3}
.item-nm.done{color:var(--text3);text-decoration:line-through}
.item-sub{font-size:11px;color:var(--text3);margin-top:2px;line-height:1.4}
.item-qt{font-size:11px;color:var(--text3);margin-top:1px}
.fm-tag{font-size:10px;font-weight:500;background:#E3EDE3;color:var(--green);padding:2px 7px;border-radius:10px;margin-left:5px;white-space:nowrap}
.recipe-tag-badge{font-size:10px;padding:2px 6px;border-radius:8px;margin-left:4px;white-space:nowrap;display:inline-block}
.stock-note{font-size:10px;color:var(--text3);background:var(--warm1);padding:3px 8px;border-radius:10px;text-align:right;line-height:1.35;max-width:90px;flex-shrink:0}

/* RECIPES TAB */
.search-wrap{position:relative;margin-bottom:14px}
.search-input{width:100%;padding:12px 14px 12px 38px;background:#fff;border:1.5px solid var(--warm2);border-radius:13px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text1);outline:none;transition:border-color .15s;-webkit-appearance:none}
.search-input:focus{border-color:var(--brown)}
.search-input::placeholder{color:var(--warm3)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:15px;pointer-events:none}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:var(--warm2);border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:11px;color:var(--text2);display:flex;align-items:center;justify-content:center}
.recipe-card{display:flex;align-items:center;gap:12px;padding:13px 14px 13px 18px;background:#fff;border-radius:16px;margin-bottom:8px;box-shadow:0 1px 8px rgba(44,32,22,.06);position:relative;overflow:hidden;transition:opacity .2s}
.recipe-accent{position:absolute;left:0;top:0;bottom:0;width:3.5px;border-radius:16px 0 0 16px}
.recipe-info{flex:1;min-width:0}
.recipe-nm{font-size:14px;font-weight:500;color:var(--text1);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recipe-meta{display:flex;align-items:center;gap:7px;margin-top:3px;flex-wrap:wrap}
.recipe-tag{font-size:11px;color:var(--text3)}
.recipe-link{font-size:10.5px;color:var(--blue);text-decoration:none}
.recipe-card.inactive{opacity:.38}
.toggle-btn{width:30px;height:30px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0;transition:all .15s;font-family:'DM Sans',sans-serif}
.toggle-btn.on{background:var(--green);color:#fff}
.toggle-btn.off{background:var(--warm1);color:var(--text3)}
.toggle-btn.special{background:#F0E8DC;color:var(--brown);cursor:default;font-size:12px}
.del-btn{width:26px;height:26px;border-radius:50%;border:none;background:var(--warm1);color:var(--text3);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.del-btn:active{background:#f5dada;color:var(--red)}

/* SUGGESTIONS */
.suggestion-card{display:flex;flex-direction:column;padding:14px 16px;background:#fff;border-radius:16px;margin-bottom:10px;box-shadow:0 1px 8px rgba(44,32,22,.06);position:relative}
.suggestion-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.suggestion-info{flex:1;min-width:0}
.suggestion-nm{font-size:14px;font-weight:500;color:var(--text1);line-height:1.35;margin-bottom:3px}
.suggestion-desc{font-size:12px;color:var(--text3);line-height:1.45}
.suggestion-actions{display:flex;gap:7px;flex-wrap:wrap}
.sug-btn{padding:7px 14px;border-radius:20px;border:none;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;text-decoration:none;display:inline-flex;align-items:center}
.sug-btn.add{background:var(--dark);color:var(--cream)}
.sug-btn.link{background:var(--warm1);color:var(--text2)}
.sug-btn.dismiss{background:transparent;color:var(--text3);padding:7px 8px}

/* FAB */
.fab{position:fixed;bottom:calc(var(--safe-bottom) + 24px);right:calc(50% - 195px);width:54px;height:54px;background:var(--dark);color:var(--cream);border:none;border-radius:50%;font-size:26px;cursor:pointer;box-shadow:0 4px 20px rgba(44,32,22,.25);display:flex;align-items:center;justify-content:center;transition:transform .15s;z-index:40;line-height:1}
.fab:active{transform:scale(.9)}
@media(max-width:430px){.fab{right:20px}}

/* MODALS */
.backdrop{position:fixed;inset:0;background:rgba(44,32,22,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:90;display:flex;align-items:flex-end;justify-content:center;animation:bdIn .2s ease}
@keyframes bdIn{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:430px;background:var(--cream);border-radius:26px 26px 0 0;padding:0 20px calc(var(--safe-bottom) + 28px);animation:sheetUp .32s cubic-bezier(.32,.72,0,1);max-height:92vh;overflow-y:auto}
.sheet::-webkit-scrollbar{display:none}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:38px;height:4px;background:var(--warm3);border-radius:2px;margin:12px auto 20px}
.sheet-title{font-family:'Fraunces',serif;font-size:24px;font-weight:400;color:var(--dark);margin-bottom:22px}
.sheet-title em{font-style:italic;color:var(--brown)}
.field-lbl{font-size:10.5px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-bottom:7px}
.field-in{width:100%;padding:13px 14px;background:#fff;border:1.5px solid var(--warm2);border-radius:13px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text1);outline:none;margin-bottom:16px;transition:border-color .15s;-webkit-appearance:none}
.field-in:focus{border-color:var(--brown)}
.field-in::placeholder{color:var(--warm3)}
.src-picker{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.src-chip{padding:7px 14px;border-radius:20px;border:1.5px solid var(--warm2);background:#fff;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .15s}
.src-chip.selected{border-color:transparent;color:#fff}
.confirm-btn{width:100%;padding:15px;background:var(--dark);color:var(--cream);border:none;border-radius:14px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:opacity .15s,transform .15s;margin-top:4px}
.confirm-btn:disabled{opacity:.35;cursor:default}
.confirm-btn:not(:disabled):active{opacity:.85;transform:scale(.99)}
.pick-search-wrap{position:relative;margin-bottom:14px}
.pick-search{width:100%;padding:12px 14px 12px 38px;background:#fff;border:1.5px solid var(--warm2);border-radius:13px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text1);outline:none;transition:border-color .15s;-webkit-appearance:none}
.pick-search:focus{border-color:var(--brown)}
.pick-search::placeholder{color:var(--warm3)}
.pick-search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:15px;pointer-events:none}
.pick-list{border-radius:13px;background:#fff;box-shadow:0 1px 8px rgba(44,32,22,.07);max-height:340px;overflow-y:auto}
.pick-list::-webkit-scrollbar{display:none}
.pick-item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--warm1);transition:background .1s}
.pick-item:last-child{border-bottom:none}
.pick-item:active{background:var(--warm1)}
.pick-item-info{flex:1}
.pick-item-name{font-size:14px;font-weight:500;color:var(--text1);line-height:1.3}
.pick-item-tag{font-size:11px;margin-top:2px}
.pick-item-add{background:var(--dark);color:var(--cream);border:none;border-radius:20px;padding:5px 14px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;flex-shrink:0}
.hint{font-size:12px;color:var(--text3);margin-bottom:14px;line-height:1.5;padding:0 2px}
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-icon{font-size:40px;margin-bottom:12px}
</style>
</head>
<body>
<div id="app">
  <div class="app-header">
    <div class="eyebrow">Mark &amp; Maddi</div>
    <div class="page-title" id="page-title"><em>This</em>&nbsp;week</div>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="planner" onclick="switchTab('planner')"><span class="tab-icon">📅</span>Plan</button>
    <button class="tab-btn" data-tab="list" onclick="switchTab('list')"><span class="tab-icon">🛒</span>List</button>
    <button class="tab-btn" data-tab="recipes" onclick="switchTab('recipes')"><span class="tab-icon">📖</span>Recipes</button>
  </div>
  <div class="scroll-area" id="scroll-area"></div>
</div>

<!-- Add Recipe Modal -->
<div class="backdrop" id="modal-add" style="display:none" onclick="if(event.target===this)closeModal('modal-add')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Add a <em>recipe</em></div>
    <div class="field-lbl">Recipe name *</div>
    <input class="field-in" id="f-name" placeholder="e.g. Thai Basil Chicken" oninput="validateForm()">
    <div class="field-lbl">Tags (optional)</div>
    <input class="field-in" id="f-tag" placeholder="e.g. Chicken · Asian">
    <div class="field-lbl">Source</div>
    <div class="src-picker" id="src-picker"></div>
    <div class="field-lbl">Recipe URL (optional)</div>
    <input class="field-in" id="f-url" type="url" placeholder="https://...">
    <button class="confirm-btn" id="confirm-btn" onclick="submitRecipe()" disabled>Add to recipe bank</button>
  </div>
</div>

<!-- Pick Meal Modal -->
<div class="backdrop" id="modal-pick" style="display:none" onclick="if(event.target===this)closeModal('modal-pick')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="pick-title">Choose a <em>meal</em></div>
    <div class="pick-search-wrap">
      <span class="pick-search-icon">🔍</span>
      <input class="pick-search" id="pick-search-input" placeholder="Search recipes…" oninput="renderPickList()">
    </div>
    <div class="pick-list" id="pick-list"></div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// SOURCES
// ─────────────────────────────────────────────────────────────────────────────
const SOURCES={
  own:   {label:"My Recipe", color:"#A8896C"},

const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat"];

// ─────────────────────────────────────────────────────────────────────────────

  }},
  {id:3,name:"Greek Chicken Kebab Bowl",tag:"Chicken · Bowl",src:"ontrac",url:"https://ontrac5.com/recipes/high-protein-greek-chicken-kebab-bowl",special:false,active:true,ingredients:{
    fm:["Lebanese cucumbers (2)"],

    pantry:["Olive oil","Dried oregano","Cumin","Smoked paprika","Salt & pepper"],

  {id:4,name:"Sausages & Mash",tag:"Pork · Comfort",src:"own",url:"",special:false,active:true,ingredients:{

    meat:["Herb & Garlic sausages (1 pack)"],
    dairy:["Butter (2 tbsp)","Milk (splash)"],

  }},
  {id:5,name:"Steak w/ Chimichurri & Chips",tag:"Beef · Grill",src:"own",url:"",special:false,active:true,ingredients:{

function lss(k,v){try{localStorage.setItem("pantry_"+k,JSON.stringify(v))}catch{}}

  weekMeals: ls("weekMeals") || [],

  pickDayIndex:null,
  dismissedSuggestions: ls("dismissedSugs") || [],
};

function pickMeals(){
  const eligible=state.recipes.filter(r=>!r.special&&r.active);
  return [...eligible].sort(()=>Math.random()-.5).slice(0,6);
}

// ─────────────────────────────────────────────────────────────────────────────
// DYNAMIC SHOPPING LIST BUILDER
// Merges staples + recipe ingredients, deduplicates by name-key, labels sources
// ─────────────────────────────────────────────────────────────────────────────
function buildShoppingList(){
  const aisleMap={};
  AISLES.forEach(a=>{aisleMap[a.key]=[];});

  // 1. Add staples first
  AISLES.forEach(a=>{
    (STAPLES[a.key]||[]).forEach(item=>{
      aisleMap[a.key].push({...item, staple:true, recipes:[]});
    });
  });

  // 2. Layer in recipe ingredients
  state.weekMeals.forEach(meal=>{
    const recipe=state.recipes.find(r=>r.id===meal.id);
    if(!recipe||!recipe.ingredients) return;
    const srcColor=(SOURCES[recipe.src]||SOURCES.other).color;
    AISLES.forEach(a=>{
      const ings=recipe.ingredients[a.key]||[];
      ings.forEach(ingStr=>{
        const normKey=ingStr.toLowerCase().replace(/\(.*?\)/g,"").trim().split(/[,\s]+/).slice(0,2).join(" ");
        const existing=aisleMap[a.key].find(i=>{
          const ek=i.n.toLowerCase().replace(/\(.*?\)/g,"").trim().split(/[,\s]+/).slice(0,2).join(" ");
          return ek===normKey||ek.includes(normKey)||normKey.includes(ek);
        });
        if(existing){
          if(!existing.recipes) existing.recipes=[];
          if(!existing.recipes.find(r=>r.id===meal.id)) existing.recipes.push({id:meal.id,name:meal.name,color:srcColor});
        } else {
          aisleMap[a.key].push({n:ingStr,qty:"",staple:false,recipes:[{id:meal.id,name:meal.name,color:srcColor}]});
        }
      });
    });
  });

  return AISLES.map(a=>({...a, items:aisleMap[a.key]})).filter(a=>a.items.length>0);
}

  const totalItems=list.reduce((a,s)=>a+s.items.length,0);
  const fmItems=(list.find(a=>a.key==="fm")||{items:[]}).items.length;
  let h=`<div class="week-stats">
    <div class="stat-pill"><div class="stat-num">${state.weekMeals.length}</div><div class="stat-lbl">dinners</div></div>
    <div class="stat-pill"><div class="stat-num">${totalItems-fmItems}</div><div class="stat-lbl">woolies items</div></div>
    <div class="stat-pill"><div class="stat-num">${fmItems}</div><div class="stat-lbl">mkt items</div></div>
  </div>
  <div class="meals-container" id="meals-container">`;
  state.weekMeals.forEach((m,i)=>{
    const s=SOURCES[m.src]||SOURCES.other;
    h+=`<div class="meal-row" data-index="${i}" draggable="true"
      ondragstart="onDragStart(event,${i})" ondragover="onDragOver(event,${i})"
      ondragend="onDragEnd()" ondrop="onDrop(event,${i})">
      <span class="drag-handle">⠿</span>
      <span class="meal-day">${DAYS[i]}</span>
      <div class="meal-name-wrap"><div class="meal-name">${escHtml(m.name)}</div></div>
      <span class="src-pill" style="background:${s.color}22;color:${s.color}">${s.label}</span>
      <button class="meal-remove" onclick="removeMealFromWeek(${i})">✕</button>
    </div>`;
  });
  for(let i=state.weekMeals.length;i<6;i++){
    h+=`<div class="add-meal-row" onclick="openPickModal(${i})">
      <div class="add-meal-icon">+</div>
      <span class="add-meal-text">${DAYS[i]} — tap to add a meal</span>

  }
  h+=`<div class="meal-rest"><span class="meal-day">Sun</span><span>Leftovers / rest</span></div>

  <button class="shuffle-btn" onclick="shuffle()">
    <span class="shuffle-icon" id="shuffle-icon">⟳</span> Shuffle this week

  return h;
}

      ${done>0?`<button class="reset-btn" onclick="resetChecked()">Reset</button>`:""}
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  </div>`;

  list.forEach((aisle,ai)=>{
    if(!aisle.items.length) return;
    h+=`<div class="aisle-block"><div class="card" style="padding:0">
      <div class="aisle-header-row">
        <div class="aisle-dot" style="background:${aisle.color}"></div>
        <span class="aisle-name-txt">${aisle.name}</span>
        <span class="aisle-count">${aisle.items.length}</span>
      </div>`;
    aisle.items.forEach((item,ii)=>{
      const key=`${aisle.key}-${ii}`;
      const dn=state.checked[key];
      const isFm=aisle.key==="fm";
      // Recipe badges (up to 2 shown)
      let badgeHtml="";
      if(item.recipes&&item.recipes.length){
        item.recipes.slice(0,2).forEach(r=>{
          const shortName=r.name.split(" ").slice(0,2).join(" ");
          badgeHtml+=`<span class="recipe-tag-badge" style="background:${r.color}18;color:${r.color}">${shortName}</span>`;
        });
        if(item.recipes.length>2) badgeHtml+=`<span style="font-size:10px;color:var(--text3)">+${item.recipes.length-2} more</span>`;
      }
      const subLine=badgeHtml?`<div class="item-sub">${badgeHtml}</div>`:"";
      h+=`<div class="shop-item" onclick="toggleCheck('${key}')">
        <div class="check-ring ${dn?"done":""}">${dn?"✓":""}</div>
        <div class="item-info">
          <div class="item-nm ${dn?"done":""}">${escHtml(item.n)}${isFm?'<span class="fm-tag">FM</span>':""}</div>
          ${item.qty?`<div class="item-qt">${escHtml(item.qty)}</div>`:""}
          ${!dn?subLine:""}
        </div>
        ${item.stock&&!dn?`<div class="stock-note">${escHtml(item.stock)}</div>`:""}
      </div>`;
    });
    h+=`</div></div>`;
  });
  return h;
}

function renderRecipes(){
  const q=state.searchQ.toLowerCase().trim();
  const order=["own","kic","rte","ontrac","other"];
  const visibleSuggestions=SUGGESTIONS.filter(s=>!state.dismissedSuggestions.includes(s.id));

  let h=`<div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="recipe-search" placeholder="Search your recipes…"
      value="${escHtml(state.searchQ)}" oninput="updateSearch(this.value)">
    ${state.searchQ?`<button class="search-clear" onclick="updateSearch('')">✕</button>`:""}
  </div>`;

  const filtered=state.recipes.filter(r=>{
    if(!q) return true;
    return r.name.toLowerCase().includes(q)||r.tag.toLowerCase().includes(q)||(SOURCES[r.src]||SOURCES.other).label.toLowerCase().includes(q);
  });

  let any=false;
  order.forEach(srcKey=>{
    const list=filtered.filter(r=>(r.src||"other")===srcKey);
    if(!list.length) return;
    any=true;
    const s=SOURCES[srcKey];
    h+=`<div class="section-label">${s.label}</div>`;
    list.forEach(r=>{
      const inactive=!r.active&&!r.special;
      const inWeek=state.weekMeals.some(m=>m.id===r.id);
      h+=`<div class="recipe-card ${inactive?"inactive":""}">
        <div class="recipe-accent" style="background:${s.color}"></div>
        <div class="recipe-info">
          <div class="recipe-nm">${escHtml(r.name)}${r.special?" ✦":""}${inWeek?` <span style="font-size:10px;color:var(--green)">● this week</span>`:""}</div>
          <div class="recipe-meta">
            <span class="recipe-tag">${escHtml(r.tag)}</span>
            ${r.url?`<a class="recipe-link" href="${r.url}" target="_blank" onclick="event.stopPropagation()">recipe ↗</a>`:""}
          </div>
        </div>
        ${r.special
          ?`<button class="toggle-btn special">✦</button>`
          :`<button class="toggle-btn ${r.active?"on":"off"}" onclick="toggleRecipe(${r.id})">${r.active?"✓":"+"}</button>`
        }
        <button class="del-btn" onclick="deleteRecipe(${r.id})">✕</button>
      </div>`;
    });
  });
  if(!any) h+=`<div class="empty"><div class="empty-icon">🔍</div><p>No recipes match.</p></div>`;

  if(!q&&visibleSuggestions.length){
    h+=`<div class="section-label" style="margin-top:28px">✨ You might like</div>
    <div class="hint">From your favourite sources — tap Add to include in your recipe bank.</div>`;
    visibleSuggestions.forEach(s=>{
      const src=SOURCES[s.src]||SOURCES.other;
      h+=`<div class="suggestion-card">
        <div class="suggestion-top">
          <div class="suggestion-info">
            <div class="suggestion-nm">${escHtml(s.name)} <span style="font-size:10px;color:var(--text3)">· ${s.time}</span></div>
            <div class="suggestion-desc">${escHtml(s.desc)}</div>
          </div>
          <span class="src-pill" style="background:${src.color}22;color:${src.color};flex-shrink:0">${src.label}</span>
        </div>
        <div class="suggestion-actions">
          <button class="sug-btn add" onclick="addSuggestion('${s.id}')">+ Add recipe</button>
          ${s.url?`<a class="sug-btn link" href="${s.url}" target="_blank">View ↗</a>`:""}
          <button class="sug-btn dismiss" onclick="dismissSuggestion('${s.id}')">Not for us</button>
        </div>
      </div>`;
    });
  }
  return h;
}

// ─────────────────────────────────────────────────────────────────────────────
// ACTIONS
// ─────────────────────────────────────────────────────────────────────────────
function switchTab(tab){
  state.tab=tab;
  state.checked={};  // reset checks when switching tabs so list stays fresh
  render();
  document.getElementById("scroll-area").scrollTop=0;
}

function shuffle(){
  const icon=document.getElementById("shuffle-icon");
  if(icon){icon.classList.add("spin");setTimeout(()=>icon.classList.remove("spin"),400);}
  setTimeout(()=>{
    state.weekMeals=pickMeals();
    lss("weekMeals",state.weekMeals);
    state.checked={};
    render();
  },150);
}

function removeMealFromWeek(i){
  state.weekMeals.splice(i,1);
  lss("weekMeals",state.weekMeals);
  state.checked={};
  render();
}

function toggleCheck(key){state.checked[key]=!state.checked[key];render();}
function resetChecked(){state.checked={};render();}

function toggleRecipe(id){
  state.recipes=state.recipes.map(r=>r.id===id?{...r,active:!r.active}:r);
  lss("recipes",state.recipes);render();
}

function deleteRecipe(id){
  state.recipes=state.recipes.filter(r=>r.id!==id);
  state.weekMeals=state.weekMeals.filter(m=>m.id!==id);
  lss("recipes",state.recipes);lss("weekMeals",state.weekMeals);
  state.checked={};render();
}

function updateSearch(v){
  state.searchQ=v;render();
  const el=document.getElementById("recipe-search");
  if(el){el.focus();el.setSelectionRange(v.length,v.length);}
}

function addSuggestion(id){
  const s=SUGGESTIONS.find(x=>x.id===id);
  if(!s) return;
  const newR={id:Date.now(),name:s.name,tag:s.tag,src:s.src,url:s.url,special:false,active:true,ingredients:s.ingredients||{}};
  state.recipes=[...state.recipes,newR];
  state.dismissedSuggestions=[...state.dismissedSuggestions,id];
  lss("recipes",state.recipes);lss("dismissedSugs",state.dismissedSuggestions);
  render();
}

function dismissSuggestion(id){
  state.dismissedSuggestions=[...state.dismissedSuggestions,id];
  lss("dismissedSugs",state.dismissedSuggestions);render();
}

// ─────────────────────────────────────────────────────────────────────────────
// DRAG & DROP (desktop)
// ─────────────────────────────────────────────────────────────────────────────
let dragSrc=null,dragOver=null;
function onDragStart(e,i){dragSrc=i;e.dataTransfer.effectAllowed="move";setTimeout(()=>{const el=document.querySelector(`[data-index="${i}"]`);if(el)el.classList.add("dragging");},0);}
function onDragOver(e,i){e.preventDefault();e.dataTransfer.dropEffect="move";if(dragOver!==i){document.querySelectorAll(".meal-row").forEach(el=>el.classList.remove("drag-over"));const el=document.querySelector(`[data-index="${i}"]`);if(el)el.classList.add("drag-over");dragOver=i;}}
function onDrop(e,i){e.preventDefault();if(dragSrc===null||dragSrc===i)return;const meals=[...state.weekMeals];const[moved]=meals.splice(dragSrc,1);meals.splice(i,0,moved);state.weekMeals=meals;lss("weekMeals",state.weekMeals);dragSrc=null;dragOver=null;state.checked={};render();}
function onDragEnd(){document.querySelectorAll(".meal-row").forEach(el=>{el.classList.remove("dragging");el.classList.remove("drag-over");});dragSrc=null;dragOver=null;}

// Touch drag (mobile)
let tSrc=null,tEl=null,tClone=null,tStartY=0;
document.addEventListener("touchstart",e=>{
  const h=e.target.closest(".drag-handle");if(!h)return;
  const row=h.closest(".meal-row");if(!row)return;
  tSrc=parseInt(row.dataset.index);tEl=row;tStartY=e.touches[0].clientY;
  tClone=row.cloneNode(true);
  const r=row.getBoundingClientRect();
  tClone.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;opacity:.85;z-index:999;pointer-events:none;border-radius:14px;background:#fff;box-shadow:0 8px 32px rgba(44,32,22,.2)`;
  document.body.appendChild(tClone);row.style.opacity=".3";e.preventDefault();
},{passive:false});
document.addEventListener("touchmove",e=>{
  if(tSrc===null||!tClone)return;
  const dy=e.touches[0].clientY-tStartY;
  tClone.style.top=(tEl.getBoundingClientRect().top+dy-(e.touches[0].clientY-tStartY-0))+"px";
  tClone.style.top=(parseFloat(tClone.style.top)+dy-(parseFloat(tClone.style.top)-tEl.getBoundingClientRect().top))+"px";
  const rect=tEl.getBoundingClientRect();
  tClone.style.top=(rect.top+dy-0)+"px";
  document.querySelectorAll(".meal-row").forEach(el=>el.style.background="");
  const under=document.elementFromPoint(e.touches[0].clientX,e.touches[0].clientY);
  const targetRow=under?under.closest(".meal-row"):null;
  if(targetRow&&targetRow!==tEl)targetRow.style.background="var(--warm1)";
  e.preventDefault();
},{passive:false});
document.addEventListener("touchend",e=>{
  if(tSrc===null)return;
  if(tClone){tClone.remove();tClone=null;}
  if(tEl)tEl.style.opacity="";
  const under=document.elementFromPoint(e.changedTouches[0].clientX,e.changedTouches[0].clientY);
  const targetRow=under?under.closest(".meal-row"):null;
  document.querySelectorAll(".meal-row").forEach(el=>el.style.background="");
  if(targetRow&&targetRow!==tEl){
    const ti=parseInt(targetRow.dataset.index);
    if(!isNaN(ti)&&ti!==tSrc){
      const meals=[...state.weekMeals];const[moved]=meals.splice(tSrc,1);meals.splice(ti,0,moved);
      state.weekMeals=meals;lss("weekMeals",state.weekMeals);state.checked={};render();
    }
  }
  tSrc=null;tEl=null;
});

// ─────────────────────────────────────────────────────────────────────────────
// PICK MEAL MODAL
// ─────────────────────────────────────────────────────────────────────────────
function openPickModal(dayIndex){
  state.pickDayIndex=dayIndex;
  document.getElementById("pick-title").innerHTML=`Add meal for <em>${DAYS[dayIndex]}</em>`;
  document.getElementById("pick-search-input").value="";
  renderPickList();
  document.getElementById("modal-pick").style.display="flex";
  setTimeout(()=>document.getElementById("pick-search-input").focus(),350);
}
function renderPickList(){
  const q=(document.getElementById("pick-search-input")||{}).value||"";
  const inWeek=new Set(state.weekMeals.map(m=>m.id));
  const list=state.recipes.filter(r=>{
    if(r.special||inWeek.has(r.id)) return false;
    if(!q) return true;
    return r.name.toLowerCase().includes(q.toLowerCase())||r.tag.toLowerCase().includes(q.toLowerCase());
  });
  const el=document.getElementById("pick-list");if(!el)return;
  if(!list.length){el.innerHTML=`<div style="padding:24px;text-align:center;color:var(--text3);font-size:13px">No matching recipes</div>`;return;}
  el.innerHTML=list.map(r=>{
    const s=SOURCES[r.src]||SOURCES.other;
    return `<div class="pick-item" onclick="addMealToDay(${r.id})">
      <div class="pick-item-info">
        <div class="pick-item-name">${escHtml(r.name)}</div>
        <div class="pick-item-tag" style="color:${s.color}">${s.label} · ${escHtml(r.tag)}</div>
      </div>
      <button class="pick-item-add">Add</button>
    </div>`;
  }).join("");
}
function addMealToDay(recipeId){
  const recipe=state.recipes.find(r=>r.id===recipeId);
  if(!recipe||state.pickDayIndex===null)return;
  if(state.weekMeals.length>state.pickDayIndex){
    state.weekMeals.splice(state.pickDayIndex,0,recipe);
    if(state.weekMeals.length>6)state.weekMeals=state.weekMeals.slice(0,6);
  } else {
    state.weekMeals.push(recipe);
  }
  lss("weekMeals",state.weekMeals);
  state.checked={};
  closeModal("modal-pick");render();
}

// ─────────────────────────────────────────────────────────────────────────────
// ADD RECIPE MODAL
// ─────────────────────────────────────────────────────────────────────────────
function openAddModal(){
  document.getElementById("f-name").value="";
  document.getElementById("f-tag").value="";
  document.getElementById("f-url").value="";
  state.selectedSrc="own";renderSrcPicker();validateForm();
  document.getElementById("modal-add").style.display="flex";
  setTimeout(()=>document.getElementById("f-name").focus(),350);
}
function renderSrcPicker(){
  document.getElementById("src-picker").innerHTML=Object.entries(SOURCES).map(([k,v])=>
    `<button class="src-chip ${state.selectedSrc===k?"selected":""}" style="${state.selectedSrc===k?`background:${v.color};`:""}" onclick="selectSrc('${k}')">${v.label}</button>`
  ).join("");
}
function selectSrc(src){state.selectedSrc=src;renderSrcPicker();}
function validateForm(){document.getElementById("confirm-btn").disabled=!document.getElementById("f-name").value.trim();}
function submitRecipe(){
  const name=document.getElementById("f-name").value.trim();
  if(!name)return;
  // New recipes get empty ingredients — they'll still show from staples
  const r={id:Date.now(),name,tag:document.getElementById("f-tag").value.trim()||"—",src:state.selectedSrc,url:document.getElementById("f-url").value.trim(),special:false,active:true,ingredients:{}};
  state.recipes=[...state.recipes,r];
  lss("recipes",state.recipes);
  closeModal("modal-add");switchTab("recipes");
}
function closeModal(id){document.getElementById(id).style.display="none";}

// ─────────────────────────────────────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────────────────────────────────────
function escHtml(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

// Service worker for offline
if("serviceWorker"in navigator){
  const sw=`const C="pantry-v2";self.addEventListener("install",e=>e.waitUntil(caches.open(C).then(c=>c.addAll([location.pathname]))));self.addEventListener("fetch",e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))))`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:"application/javascript"}))).catch(()=>{});
}

render();
</script>
</body>
